; Back-office suite settings. Deliberately NOT at the repo root: a root
; pytest.ini would also govern the exe suites, and this file turns on
; Playwright-only options (screenshots, video, tracing) that mean nothing
; to a pywinauto run and would change how those suites behave.
;
; Run from pos_framework/pos_framework:
;   APP=demostore ..\venv\Scripts\python -m pytest backoffice -c backoffice/pytest.ini
;   APP=storeb         ..\venv\Scripts\python -m pytest backoffice -c backoffice/pytest.ini
;
; headed vs headless is a command-line choice (--headed), not a setting -
; the same suite has to run both on a tester's screen and unattended.
[pytest]
testpaths = tests

addopts =
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --alluredir=../reports/allure-results-backoffice

markers =
    smoke: the few checks that prove the environment and the harness work
    module: exercises one back-office module end to end
    client_issue: reproduces something a client reported
